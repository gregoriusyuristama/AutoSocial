<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AutoSocial -- Reset password</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-50 text-slate-900 font-sans">
  <main class="mx-auto mt-16 w-full max-w-md px-4">
    <div class="rounded-2xl bg-white border border-slate-200 shadow-lg p-8 transition-all duration-300">
      <header class="mb-6">
        <h1 class="text-2xl font-semibold text-slate-900">Reset password</h1>
        <p class="text-sm text-slate-500 mt-1">A reset token will be printed to your server terminal.</p>
      </header>

      <form id="reset-form" class="space-y-5" novalidate>
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1.5" for="username">Username</label>
          <input id="username" name="username" type="text" required autocomplete="username"
                 class="w-full rounded-2xl bg-white border border-slate-300 px-4 py-2.5 text-slate-900 placeholder:text-slate-400 focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 transition-all duration-300" />
        </div>

        <div id="notice" role="status" aria-live="polite"
             class="hidden rounded-xl bg-emerald-50 border border-emerald-200 text-emerald-800 px-4 py-3 text-sm"></div>

        <button type="submit"
                class="w-full rounded-2xl bg-emerald-600 hover:bg-emerald-700 hover:-translate-y-0.5 text-white font-medium py-2.5 shadow-lg transition-all duration-300 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:ring-offset-2 focus:ring-offset-white">
          Send reset token
        </button>
      </form>

      <footer class="mt-6 text-center">
        <a href="/auth/login" class="text-sm font-medium text-emerald-700 hover:text-emerald-800 transition-colors">Back to sign in</a>
        <span class="mx-2 text-slate-400">-</span>
        <a href="/auth/reset/confirm" class="text-sm font-medium text-emerald-700 hover:text-emerald-800 transition-colors">I have a token</a>
      </footer>
    </div>
  </main>
  <script src="/auth/reset-request.js"></script>
</body>
</html>
