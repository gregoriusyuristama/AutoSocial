<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AutoSocial -- Sign in</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-50 text-slate-900 font-sans">
  <main class="mx-auto mt-16 w-full max-w-md px-4">
    <div class="rounded-2xl bg-white border border-slate-200 shadow-lg p-8 transition-all duration-300">
      <header class="mb-6">
        <h1 class="text-2xl font-semibold text-slate-900">Sign in</h1>
        <p class="text-sm text-slate-500 mt-1">Access your AutoSocial workspace.</p>
      </header>

      <form id="login-form" class="space-y-5" novalidate>
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1.5" for="username">Username</label>
          <input id="username" name="username" type="text" required autocomplete="username"
                 class="w-full rounded-2xl bg-white border border-slate-300 px-4 py-2.5 text-slate-900 placeholder:text-slate-400 focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 transition-all duration-300" />
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1.5" for="password">Password</label>
          <div class="relative">
            <input id="password" name="password" type="password" required autocomplete="current-password"
                   class="w-full rounded-2xl bg-white border border-slate-300 px-4 py-2.5 pr-11 text-slate-900 placeholder:text-slate-400 focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 transition-all duration-300" />
            <button type="button" id="toggle-password" aria-pressed="false" aria-label="Show password"
                    class="absolute inset-y-0 right-0 flex items-center px-3 text-slate-500 hover:text-slate-700 focus:outline-none focus:ring-2 focus:ring-emerald-500 rounded-r-2xl transition-all duration-300">
              <svg data-icon="eye" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z" />
                <circle cx="12" cy="12" r="3" />
              </svg>
              <svg data-icon="eye-off" xmlns="http://www.w3.org/2000/svg" class="hidden h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-6.5 0-10-7-10-7a19.62 19.62 0 0 1 4.22-5.34" />
                <path d="M9.9 4.24A10.94 10.94 0 0 1 12 4c6.5 0 10 7 10 7a19.68 19.68 0 0 1-3.16 4.19" />
                <path d="M14.12 14.12A3 3 0 1 1 9.88 9.88" />
                <line x1="2" y1="2" x2="22" y2="22" />
              </svg>
            </button>
          </div>
        </div>

        <div id="error" role="alert" aria-live="polite"
             class="hidden rounded-xl bg-rose-50 border border-rose-200 text-rose-700 px-4 py-3 text-sm"></div>

        <button type="submit"
                class="w-full rounded-2xl bg-emerald-600 hover:bg-emerald-700 hover:-translate-y-0.5 text-white font-medium py-2.5 shadow-lg transition-all duration-300 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:ring-offset-2 focus:ring-offset-white">
          Sign in
        </button>
      </form>

      <footer class="mt-6 text-center">
        <a href="/auth/reset" class="text-sm font-medium text-emerald-700 hover:text-emerald-800 transition-colors">Forgot password?</a>
      </footer>
    </div>
  </main>
  <script src="/auth/login.js"></script>
</body>
</html>
